<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noir Poker · El club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700..900&family=Big+Shoulders+Display:wght@600..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="noir.css">
<script src="noir.js"></script>
<style>
/* The club after login: a game main menu. Your character under the lamp on the left, the menu in the middle, the chosen room on the right. */
html,body{height:100%}
body{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:100vh}
.bar{display:flex;align-items:center;gap:22px;padding:0 24px;height:72px;border-bottom:1px solid var(--brass-lo);box-shadow:0 2px 0 #050404,0 3px 0 rgba(185,138,60,.3);background:var(--ink)}
.wallet{margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border:1px solid var(--line-2);border-radius:999px}
.wallet .c{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,var(--ink-3) 0 45%,transparent 46%),conic-gradient(var(--blood-2) 0 25%,var(--bone) 0 50%,var(--blood-2) 0 75%,var(--bone) 0)}
.wallet b{font-family:var(--f-num);font-size:17px}
.rankbox{display:grid;gap:4px;min-width:170px}
.rankbox span{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.rankbox span b{color:var(--amber);font-family:var(--f-stencil);font-weight:900;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.xp{height:6px;background:var(--ink-4);border-radius:3px;overflow:hidden}.xp i{display:block;height:100%;width:62%;background:var(--amber)}
.me-btn{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--bone);padding:4px 12px 4px 4px;border:1px solid var(--line-2);border-radius:999px}
.me-btn i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink-3);font-family:var(--f-stencil);font-weight:900;font-style:normal}
@media (max-width:900px){.rankbox{display:none}}

.club{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(260px,.75fr) minmax(0,1.35fr);min-height:0}
.stage{position:relative;overflow:hidden;border-right:1px solid var(--line)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage .who{position:absolute;left:24px;right:24px;bottom:22px;display:grid;gap:8px}
.stage .who .kick{color:var(--blood)}
.stage .who h2{font-size:clamp(34px,3.4vw,52px)}
.stage .who .brass{justify-self:start}
.menu{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:30px 24px;border-right:1px solid var(--line);background:linear-gradient(90deg,var(--ink),var(--ink-2))}
.menu button{all:unset;cursor:pointer;display:grid;gap:2px;padding:14px 16px 14px 22px;border-radius:6px;position:relative}
.menu button b{font-family:var(--f-stencil);font-weight:900;font-size:clamp(28px,2.6vw,40px);line-height:.95;text-transform:uppercase;color:var(--bone-2);transition:color .2s,transform .3s var(--ease)}
.menu button small{font-size:13px;color:var(--muted)}
.menu button::before{content:"";position:absolute;left:4px;top:50%;width:10px;height:10px;margin-top:-5px;background:var(--blood);transform:scale(0) rotate(45deg);transition:transform .3s var(--ease)}
.menu button:hover b{color:var(--bone);transform:translateX(4px)}
.menu button[aria-selected="true"] b{color:var(--bone)}
.menu button[aria-selected="true"]::before{transform:scale(1) rotate(45deg)}
.menu button:focus-visible{outline:2px solid var(--amber)}
.room{padding:34px clamp(20px,3vw,44px);overflow:auto}
.room h3{font-size:clamp(40px,4vw,64px);margin-bottom:6px}
.room .lead{color:var(--bone-2);margin:0 0 24px;max-width:48ch}
.tables{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1.5fr) auto auto auto;gap:18px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--ink-2)}
.trow b{font-family:var(--f-stencil);font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.trow small{display:block;color:var(--muted);font-size:13px}
.seats{display:flex;gap:3px}.seats i{width:9px;height:14px;border-radius:2px;background:var(--ink-4)}.seats i.f{background:var(--bone-2)}
.blinds{font-family:var(--f-num);font-size:15px;color:var(--bone)}
.state{font-family:var(--f-pix);font-size:13px;color:var(--amber)}
@media (max-width:760px){.trow{grid-template-columns:1fr auto}.trow .seats,.trow .state{display:none}}
.tabs{display:flex;gap:6px;margin-bottom:20px}
.tabs button{height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--line-2);background:transparent;color:var(--bone-2);cursor:pointer;font-family:var(--f-stencil);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.tabs button[aria-selected="true"]{background:var(--bone);color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px;max-width:760px}
.form .wide{grid-column:1/-1}
@media (max-width:700px){.form{grid-template-columns:1fr}}
.ticket{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;margin-top:24px;padding:24px 28px;background:var(--bone);color:var(--ink);max-width:620px;
  -webkit-mask:radial-gradient(circle 12px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 12px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.ticket .code{font-family:var(--f-stencil);font-weight:900;font-size:64px;letter-spacing:.12em;line-height:1;padding-right:26px;border-right:2px dashed rgba(11,9,8,.35)}
.ticket p{margin:0 0 12px;font-size:15px}
.ticket .row{display:flex;flex-wrap:wrap;gap:10px}
.ticket .tk{--c:var(--ink);--t:var(--bone)}
.tour{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--ink-2)}
.tour .when{text-align:center;font-family:var(--f-stencil);font-weight:900;line-height:1;text-transform:uppercase}
.tour .when b{display:block;font-size:34px;color:var(--amber)}.tour .when span{font-size:14px;color:var(--muted)}
.tour h4{margin:0;font-family:var(--f-stencil);font-weight:900;font-size:24px;text-transform:uppercase}
.tour p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.bubble{position:absolute;left:24px;right:24px;top:22px;background:var(--bone);color:var(--ink);padding:12px 16px;border-radius:10px;font-size:15px;line-height:1.4;max-width:340px}
.bubble b{display:block;font-family:var(--f-pix);font-size:12px;color:var(--blood-2);letter-spacing:.1em;text-transform:uppercase}
.bubble::after{content:"";position:absolute;left:34px;bottom:-7px;width:14px;height:14px;background:var(--bone);transform:rotate(45deg)}
.feat{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:center;margin-bottom:26px;padding:14px;border:1px solid var(--brass-lo);border-radius:10px;background:linear-gradient(90deg,#1f170c,var(--ink-2))}
.feat iframe{width:120px;height:150px;border:0;display:block;border-radius:6px}
.feat .kick{color:var(--amber)}
.feat h4{margin:4px 0 2px;font-family:var(--f-stencil);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1}
.feat p{margin:0 0 12px;font-size:14px;color:var(--bone-2)}
dialog.pick{border:0;padding:0;width:min(1200px,94vw);height:min(720px,88vh);background:#07060a;box-shadow:0 0 0 1px var(--brass-lo),0 40px 100px rgba(0,0,0,.7)}
dialog.pick::backdrop{background:rgba(5,4,3,.86)}
dialog.pick iframe{width:100%;height:100%;border:0;display:block}
dialog.pick .x{position:absolute;right:14px;top:10px;z-index:2}
.guest{margin:0 0 18px;padding:12px 14px;border:1px solid var(--brass-lo);border-radius:8px;color:var(--brass-hi);font-size:14px}
@media (max-width:1100px){.club{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}.stage{display:none}}
@media (max-width:720px){.club{grid-template-columns:1fr}.menu{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}.menu button small{display:none}.menu button b{font-size:22px}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<header class="bar">
  <a class="logo" href="landing.html" aria-label="Noir Poker, volver a la entrada">
    <svg viewBox="0 0 26 34" aria-hidden="true"><path d="M13 1a9 9 0 0 1 5 16.5L21 33H5l3-15.5A9 9 0 0 1 13 1Z" fill="#efe6d3"/><path d="M13 5c2 3 6 4.6 6 8a3 3 0 0 1-5.2 2c.2 1.6.8 2.6 2 3.6h-5.6c1.2-1 1.8-2 2-3.6A3 3 0 0 1 7 13c0-3.4 4-5 6-8Z" fill="#c8402f"/></svg>
    <span><b>NOIR</b><small>CLUB DE PÓKER · 1929</small></span>
  </a>
  <div class="wallet" id="wallet" title="Tus fichas"><span class="c" aria-hidden="true"></span><b>12.480</b></div>
  <div class="rankbox"><span><b>Habitual</b>nivel 14</span><div class="xp"><i></i></div></div>
  <a class="me-btn" href="perfil.html"><i>N</i>Expediente</a>
</header>

<main class="club">
  <aside class="stage" aria-label="Tu personaje">
    <iframe id="meFrame" title="Tu personaje bajo la lámpara"></iframe>
    <p class="bubble" id="horacio"><b>Horacio, el crupier</b><span id="hLine"></span></p>
    <div class="who"><span class="kick" id="meAlias"></span><h2 class="stencil" id="meName"></h2><button class="brass" type="button" id="change"><span class="dot"></span>Cambiar de personaje</button></div>
  </aside>
  <nav class="menu" role="tablist" aria-label="Menú del club">
    <button role="tab" aria-selected="true" data-room="now"><b>Jugar ahora</b><small>Te sentamos en la mejor mesa</small></button>
    <button role="tab" aria-selected="false" data-room="mesa"><b>Mesa de siempre</b><small>Abre la tuya o entra con contraseña</small></button>
    <button role="tab" aria-selected="false" data-room="torneo"><b>Torneos</b><small>Inscríbete o organiza uno</small></button>
    <button role="tab" aria-selected="false" data-room="abiertas"><b>Mesas abiertas</b><small>Mira quién está jugando</small></button>
    <button role="tab" aria-selected="false" data-room="perfil"><b>Expediente</b><small>Rango, colección e historial</small></button>
  </nav>
  <section class="room" id="room" aria-live="polite"></section>
</main>
<dialog class="pick" id="pick" aria-label="Elige quién eres"><button class="brass x" type="button" id="pickClose">Cerrar</button><iframe id="pickFrame" title="Selector de personaje"></iframe></dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
(() => { const c = document.createElement("canvas"); c.width = c.height = 120; const x = c.getContext("2d"), im = x.createImageData(120, 120); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } x.putImageData(im, 0, 0); document.documentElement.style.setProperty("--noise", `url(${c.toDataURL()})`); })();
const GUEST = new URLSearchParams(location.search).has("guest");
let OPT = NOIR.read(); const FIRST = !OPT.me; let ME = OPT.me || "bruma";
const CAST = NOIR.CAST;
function showMe() { const [nm, al] = CAST[ME] || CAST.bruma; $("#meName").textContent = nm; $("#meAlias").textContent = al; $("#meFrame").src = `mesa-pixel?mode=cameo&id=${ME}&turn=.35`; play = `mesa-pixel?me=${ME}`; }
const LINES = ["Buenas noches. La trastienda tiene dos sillas libres.", "El Tano pregunta por usted. Dice que le debe una revancha.", "Esta noche el torneo empieza a las diez en punto. No se retrase."];
$("#hLine").textContent = LINES[Math.floor(Math.random() * LINES.length)];
const pick = $("#pick");
function openPick(first) { $("#pickFrame").src = `mesa-pixel?mode=select&me=${ME}${first ? "&first=1" : ""}`; $("#pickClose").hidden = !!first; pick.showModal(); }
$("#change").addEventListener("click", () => openPick(false));
$("#pickClose").addEventListener("click", () => pick.close());
pick.addEventListener("cancel", e => { if (FIRST && !NOIR.read().me) e.preventDefault(); });
addEventListener("message", e => { if (e.data && e.data.chosen) { ME = e.data.chosen; OPT = NOIR.read(); OPT.me = ME; NOIR.write(OPT); showMe(); openRoom(document.querySelector('.menu button[aria-selected="true"]').dataset.room); setTimeout(() => pick.close(), 500); } });
if (GUEST) { $("#wallet").innerHTML = "<b>Invitado</b>"; $(".me-btn").innerHTML = "<i>?</i>Invitado"; }
let play = `mesa-pixel?me=${ME}`; showMe();
const TABLES = [["La trastienda de Nico", "Trastienda · con fichas", 6, "10/20", "En juego", "K7Q2"], ["Viernes de Ofelia", "Club de jazz · con fichas", 8, "25/50", "Mano 31", "B4RD"], ["Los del puerto", "Almacén · sin fichas", 3, "5/10", "Esperando", "MU3L"], ["Mesa del crack", "Trastienda · sin fichas", 5, "10/20", "En juego", "CR29"]];
const seats = n => `<span class="seats" aria-label="${n} de 9 sillas ocupadas">${Array.from({ length: 9 }, (_, k) => `<i class="${k < n ? "f" : ""}"></i>`).join("")}</span>`;
const trow = t => `<div class="trow"><div><b>${t[0]}</b><small>${t[1]} · contraseña ${t[5]}</small></div>${seats(t[2])}<span class="blinds">${t[3]}</span><a class="tk sm" href="${play}">Sentarme</a></div>`;
const guestNote = GUEST ? `<p class="guest">Como invitado solo puedes sentarte en mesas sin fichas. Entra con tu cuenta para jugar con fichas y ganar rango.</p>` : "";
function feat() { const id = NOIR.featured, [nm, al] = CAST[id]; if (id === ME) return "";
  return `<div class="feat"><iframe src="mesa-pixel?mode=cameo&id=${id}&turn=-.3" title="${nm}" loading="lazy"></iframe><div><span class="kick">Personaje de la semana</span><h4>${nm}</h4><p>${al}. Disponible para todos hasta el ${NOIR.weekEnds}.</p><button class="tk sm" type="button" data-try="${id}">Ser ${CAST[id][2]} esta noche</button></div></div>`; }
const ROOMS = {
  now: () => `${feat()}<h3 class="stencil">Te guardamos silla</h3><p class="lead">Estas mesas tienen sitio y ciegas parecidas a las tuyas.</p>${guestNote}<div class="tables">${TABLES.slice(0, 3).map(trow).join("")}</div><div style="margin-top:22px"><a class="tk red" href="${play}">Sentarme ya</a></div>`,
  mesa: () => `<h3 class="stencil">Mesa de siempre</h3><p class="lead">Abre una mesa y pasa la contraseña, o entra a la de un amigo.</p>
    <div class="tabs" role="tablist"><button type="button" aria-selected="true" data-sub="abrir">Abrir</button><button type="button" aria-selected="false" data-sub="unir">Unirme</button></div>
    <div id="sub"></div>`,
  torneo: () => `<h3 class="stencil">Torneos</h3><p class="lead">Todos empiezan igual y las ciegas suben con el reloj.</p>${guestNote}<div class="tables">
    ${[["Vie", "22:00", "El Viernes Negro", "27 de 45 inscritos · 3.000 fichas · niveles de 10 min"], ["Sáb", "20:30", "Copa del Muelle", "12 de 18 inscritos · solo socios · con recompra"], ["Dom", "18:00", "Domingo de Resaca", "4 de 9 · sin fichas · turbo"]].map(t => `<div class="tour"><div class="when"><b>${t[1]}</b><span>${t[0]}</span></div><div><h4>${t[2]}</h4><p>${t[3]}</p></div><button class="tk sm" type="button" data-reg>Inscribirme</button></div>`).join("")}
    </div><div style="margin-top:22px"><button class="brass" type="button"><span class="dot"></span>Organizar un torneo</button></div>`,
  abiertas: () => `<h3 class="stencil">Mesas abiertas</h3><p class="lead">Puedes mirar sin sentarte. Si está llena, te pones en la fila.</p>
    <div class="seg" style="margin-bottom:16px"><button type="button" aria-pressed="true">Todas</button><button type="button" aria-pressed="false">Con fichas</button><button type="button" aria-pressed="false">Sin fichas</button><button type="button" aria-pressed="false">Con sillas libres</button></div>
    <div class="tables">${TABLES.map(trow).join("")}</div>`,
  perfil: () => { location.href = "perfil.html"; return ""; },
};
const SUB = {
  abrir: () => `<form class="form" id="newTable">
    <div class="field wide"><label for="tn">Nombre de la mesa</label><input id="tn" value="La trastienda de Nico"></div>
    <div class="field"><span class="lab">Sillas</span><div class="seg" data-group="seats">${[2, 4, 6, 9].map(n => `<button type="button" aria-pressed="${n === 9}">${n}</button>`).join("")}</div></div>
    <div class="field"><label for="bl">Ciegas</label><select id="bl"><option>5/10</option><option selected>10/20</option><option>25/50</option><option>50/100</option></select></div>
    <div class="field"><span class="lab">Fichas</span><div class="seg" data-group="money"><button type="button" aria-pressed="${!GUEST}" ${GUEST ? "disabled" : ""}>Con fichas</button><button type="button" aria-pressed="${GUEST}">Sin fichas</button></div></div>
    <div class="field"><span class="lab">Sala</span><div class="seg" data-group="room"><button type="button" aria-pressed="true">Trastienda</button><button type="button" aria-pressed="false">Club de jazz</button><button type="button" aria-pressed="false" disabled title="Se abre en el rango Socio">Muelle</button></div></div>
    <div class="field wide">
      <label class="toggle"><span><b>Run it twice</b><small>Se vota en cada all-in</small></span><input type="checkbox" checked></label>
      <label class="toggle"><span><b>Straddle</b><small>Doble ciega opcional</small></span><input type="checkbox"></label>
      <label class="toggle"><span><b>Bomb pot cada 10 manos</b><small>Todos al centro antes del flop</small></span><input type="checkbox"></label>
      <label class="toggle"><span><b>Aprobar asientos</b><small>Tú decides quién se sienta</small></span><input type="checkbox" checked></label>
    </div>
    <div class="wide"><button class="tk red" type="submit">Abrir la mesa</button></div></form><div id="made"></div>`,
  unir: () => `<form class="form" id="joinTable"><div class="field wide"><label for="jc">Contraseña</label><input id="jc" maxlength="6" placeholder="K7Q2" style="font:700 26px var(--f-pix);letter-spacing:.3em;text-transform:uppercase"></div><div class="wide"><button class="tk" type="submit">Pasar</button></div></form>`,
};
function openRoom(k) {
  document.querySelectorAll(".menu button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.room === k)));
  $("#room").innerHTML = ROOMS[k](); if (k === "mesa") openSub("abrir");
  if (window.gsap && !matchMedia("(prefers-reduced-motion: reduce)").matches) gsap.from("#room > *", { opacity: 0, y: 14, duration: .45, ease: "power3.out", stagger: .05 });
}
function openSub(k) { document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.sub === k))); $("#sub").innerHTML = SUB[k](); }
$(".menu").addEventListener("click", e => { const b = e.target.closest("button"); if (b) openRoom(b.dataset.room); });
$("#room").addEventListener("click", e => {
  const s = e.target.closest("[data-sub]"); if (s) openSub(s.dataset.sub);
  const seg = e.target.closest(".seg button"); if (seg && !seg.disabled) seg.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === seg)));
  const tr = e.target.closest("[data-try]"); if (tr) { ME = tr.dataset.try; OPT = NOIR.read(); OPT.me = ME; NOIR.write(OPT); showMe(); openRoom("now"); }
  const reg = e.target.closest("[data-reg]"); if (reg) { reg.textContent = reg.textContent === "Inscribirme" ? "Inscrito" : "Inscribirme"; }
});
$("#room").addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "newTable") { const code = Array.from({ length: 4 }, () => "ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 31)]).join("");
    $("#made").innerHTML = `<div class="ticket"><span class="code">${code}</span><div><p>Tu mesa está abierta. Pasa esta contraseña a quien quieras sentar.</p><div class="row"><a class="tk sm" href="${play}" data-light>Entrar a la mesa</a><button class="brass" type="button" id="copy"><span class="dot"></span>Copiar invitación</button><a class="brass" href="invitacion?mesa=${code}&host=Nico&me=${ME}"><span class="dot"></span>Ver invitación</a></div></div></div>`;
    $("#copy").addEventListener("click", () => { navigator.clipboard?.writeText(`${location.origin}/invitacion?mesa=${code}&host=Nico&me=${ME}`).catch(() => {}); $("#copy").lastChild.textContent = "Copiado"; }); }
  if (e.target.id === "joinTable") location.href = play;
});
openRoom("now"); if (FIRST) setTimeout(() => openPick(true), 600);
addEventListener("keydown", e => { const order = ["now", "mesa", "torneo", "abiertas"]; const cur = order.indexOf(document.querySelector('.menu button[aria-selected="true"]').dataset.room); if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowDown") openRoom(order[(cur + 1) % order.length]); if (e.key === "ArrowUp") openRoom(order[(cur + order.length - 1) % order.length]); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</body>
</html>
