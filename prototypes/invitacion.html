<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noir Poker · Invitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700..900&family=Big+Shoulders+Display:wght@600..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="noir.css">
<script src="noir.js"></script>
<style>
/* A shared link lands here: an open matchbook with the table written inside the flap. */
body{min-height:100vh;display:grid;place-items:center;padding:40px 18px;background:radial-gradient(ellipse at 50% 40%,#1a140f,var(--ink) 70%)}
.book{display:grid;grid-template-columns:minmax(0,300px) minmax(0,480px);perspective:1400px;filter:drop-shadow(0 40px 60px rgba(0,0,0,.6))}
.cover{position:relative;background:#8e2a22;border-radius:8px 0 0 8px;box-shadow:inset 0 0 0 10px #7a221c,inset 0 0 0 12px var(--brass-hi);display:grid;align-content:center;justify-items:center;gap:8px;padding:30px;text-align:center;transform-origin:right center}
.cover b{font-family:var(--f-stencil);font-weight:900;font-size:84px;line-height:.85;color:#f3e6c8;letter-spacing:.06em}
.cover span{font-family:var(--f-pix);font-size:14px;color:#f3e6c8;letter-spacing:.14em}
.cover .host{margin-top:18px;width:150px;height:190px;border:0;border-radius:6px;background:#0b0908}
.cover small{color:var(--brass-hi);font-size:13px}
.inside{position:relative;background:#ece3cf;color:#1a1612;border-radius:0 8px 8px 0;padding:34px 36px 30px;display:grid;gap:14px}
.inside::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;background:repeating-linear-gradient(0deg,#3a2c1a 0 3px,#5a4630 3px 6px);opacity:.25}
.inside .kick{color:#8e2a22}
.inside h1{font-size:clamp(40px,5vw,62px)}
.pw{display:flex;align-items:baseline;gap:16px;padding:14px 0;border-block:2px dashed rgba(26,22,18,.35)}
.pw span{font-size:14px;color:#5a4d3e}
.pw b{font-family:var(--f-stencil);font-weight:900;font-size:58px;letter-spacing:.14em;line-height:1}
dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
dt{font-size:13px;color:#5a4d3e}dd{margin:0;font-family:var(--f-stencil);font-weight:900;font-size:24px;text-transform:uppercase}
.seated{font-size:15px;color:#4a4034;margin:0}
.seated b{color:#1a1612}
.say{background:#1a1612;color:var(--bone);padding:10px 14px;border-radius:8px;font-size:14px;margin:0}
.say b{display:block;font-family:var(--f-pix);font-size:11px;color:var(--amber);letter-spacing:.1em;text-transform:uppercase}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.inside .brass{height:56px}
@media (max-width:820px){.book{grid-template-columns:1fr}.cover{border-radius:8px 8px 0 0}.inside{border-radius:0 0 8px 8px}.inside::before{display:none}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="book">
  <div class="cover" id="cover"><b>NOIR</b><span>CLUB PRIVADO</span><iframe class="host" id="host" title="Personaje de quien te invita"></iframe><small id="hostName"></small></div>
  <div class="inside">
    <span class="kick">Invitación para esta noche</span>
    <h1 class="stencil" id="title">Nico te guarda una silla</h1>
    <div class="pw"><span>Contraseña</span><b id="code">K7Q2</b></div>
    <dl><div><dt>Mesa</dt><dd>La trastienda</dd></div><div><dt>Ciegas</dt><dd class="num">10/20</dd></div><div><dt>Sillas</dt><dd>6 de 9</dd></div></dl>
    <p class="seated">Ya están sentados <b>La Viuda</b>, <b>El Tano</b>, <b>Dedos</b> y dos más.</p>
    <p class="say"><b>Horacio, el crupier</b>La mesa le espera. Toque tres veces al llegar.</p>
    <div class="acts"><a class="tk red" id="accept" href="landing.html" data-knock>Aceptar invitación</a><a class="brass" id="watch" href="mesa-pixel?mode=embed"><span class="dot"></span>Solo mirar</a></div>
  </div>
</main>
<script>
"use strict";
const q = new URLSearchParams(location.search), code = (q.get("mesa") || "K7Q2").toUpperCase(), host = q.get("host") || "Nico", hostChar = q.get("me") || "bruma";
document.getElementById("code").textContent = code;
document.getElementById("title").textContent = `${host} te guarda una silla`;
document.getElementById("host").src = `mesa-pixel?mode=cameo&id=${hostChar}&turn=.4`;
document.getElementById("hostName").textContent = `${host} se sienta como ${(NOIR.CAST[hostChar] || NOIR.CAST.bruma)[0]}`;
const me = NOIR.read().me;
if (localStorage.getItem("np-logged")) document.getElementById("accept").href = `mesa-pixel?me=${me || "bruma"}&mesa=${code}`;
else document.getElementById("accept").href = "panel.html";
if (!NOIR.RM && window.matchMedia) document.getElementById("cover").animate([{ transform: "rotateY(-160deg)" }, { transform: "rotateY(0)" }], { duration: 1100, easing: "cubic-bezier(.2,.8,.2,1)", delay: 500, fill: "backwards" });
</script>
</body>
</html>
